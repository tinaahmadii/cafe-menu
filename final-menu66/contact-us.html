<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="contact-us.css" />
    <title>Contact us</title>
    <link
      href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="contact-us-style.css" />
  </head>
  <body>
    <div class="container">
      <div class="contact-header">
        <div class="contact-header-text">
          <p id="head-p">آشنایی با تیم ما</p>
          <p id="head-p2">تنها  تو هستی آنچه در این راه ماندنی است.</p>
        </div>
        <img
          src="images\Frame 155.png"
          alt="about us picture"
          id="contact-img"
        />
      </div>

      <div class="contact-box1">
        <h2>راه های ارتباطی</h2>
        <div class="phone-num-div">
          <div class="img-border">
            <img src="images\Frame 159.png" alt="phone img" id="phone-img" />
          </div>
          <div class="contact-text">
            <h4 class="phon-p">شماره ی ما</h4>
            <p>0911-430-2228</p>
          </div>
        </div>
        <div class="mail-div">
          <div class="img-border">
            <img
              src="images\ion_mail-outline.png"
              alt="mail img"
              id="mail-img"
            />
          </div>
          <div class="contact-text">
            <h4>آدرس ایمیل ما</h4>
            <p>cafe@gamil.com</p>
          </div>
        </div>
      </div>
      <div class="contact-box2">
        <h2>صفحه های ما در فضای مجازی</h2>
        <div class="instagram-div">
          <div class="img-border">
            <img
              src="images\instagram.png"
              alt="instagram img"
              id="instagram-img"
            />
          </div>

          <div class="contact-text">
            <h4>اینستاگرام</h4>
            <p>exir.pro.fitness@</p>
          </div>
        </div>
        <div class="twitter-div">
          <div class="img-border">
            <img src="images\twitter.png" alt="twitter img" id="twitter-img" />
          </div>
          <div class="contact-text">
            <h4>توییتر</h4>
            <p>cafeyema@</p>
          </div>
        </div>
        <div class="facebook-div">
          <div class="img-border">
            <img
              src="images\Vector-facebook.png"
              alt="facebook img"
              id="facebook-img"
            />
          </div>
          <div class="contact-text">
            <h4>فیسبوک</h4>
            <p>cafeyema@</p>
          </div>
        </div>
      </div>
      <footer class="nav">
        <div class="nav-container">
          <a href="coming-soon.html" target="_blank"
            ><img src="images/Vector.png" alt="profile"
          /></a>
          <a href="home.html" target="_blank"
            ><img src="images/Vector copy.png" alt="home"
          /></a>
          <a href=""><img src="images/Vectorred.png" alt="call" /></a>
        </div>
      </footer>
    </div>
  </body>
</html>
