<!DOCTYPE html>
<html lang="fa">
  <head>
    <meta charset="UTF-8" />
    <title>Coming Soon</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        background: linear-gradient(
          135deg,
          #f5e6ca,
          #d9a679
        ); /* کرم → قهوه‌ای روشن */
        font-family: "Trebuchet MS", sans-serif;
      }

      h1 {
        font-size: 3.5rem;
        color: #4a2c2a; /* قهوه‌ای تیره */
        letter-spacing: 3px;
        margin-bottom: 40px;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
          opacity: 0.8;
        }
        50% {
          transform: scale(1.1);
          opacity: 1;
        }
        100% {
          transform: scale(1);
          opacity: 0.8;
        }
      }

      .loader {
        display: flex;
        gap: 12px;
      }

      .dot {
        width: 16px;
        height: 16px;
        background: #6f5542; /* قهوه‌ای متوسط */
        border-radius: 50%;
        animation: bounce 0.6s infinite alternate;
      }

      .dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dot:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes bounce {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-20px);
        }
      }

      .footer {
        position: absolute;
        bottom: 20px;
        font-size: 22px;
        color: #6f5542;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo img {
        width: auto;
        height: 70px;
        display: inline-block;
        vertical-align: middle;
        cursor: pointer;
      }
      .logo p {
        font-size: 40px;
      }
      footer.footer:hover {
        opacity: 1;
      }
      s footer.footer img:hover {
        transform: scale(1.1);
        opacity: 1;
      }
      .back-btn {
        position: fixed;
        top: 16px;
        left: 16px;
        display: flex;
        align-items: center;
        gap: 10px;
        background-color: #6f5542;
        color: #fff;
        padding: 14px 24px;
        border-radius: 6px;
        text-decoration: none;
        font-size: 25px;
        margin-top: 15px;
      }
    </style>
  </head>
  <body>
    <a href="" class="back-btn">⬅ Back</a>

    <h1>COMING SOON</h1>
    <div class="loader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <a href="home.html" class="back-btn" target="_blank">⬅ Back</a>
    <footer class="footer">
      <div class="logo">
        <p>powered by</p>
        <a href="https://sarvtech.co" target="_blank"
          ><img src="images/sarv no border - Copy.png" alt="logo"
        /></a>
      </div>
    </footer>
  </body>
</html>
